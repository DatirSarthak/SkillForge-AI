spring.application.name=backend

####################################################
# Local Environment
####################################################

spring.config.import=optional:file:.env[.properties]

####################################################
# Database
####################################################

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

####################################################
# Server
####################################################

server.port=8080

####################################################
# JWT
####################################################

application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=3600000
application.security.refresh-token.expiration=604800000

####################################################
# Gemini AI
####################################################

gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-3-flash-preview
gemini.base-url=https://generativelanguage.googleapis.com/v1beta/models

####################################################
# Multipart
####################################################

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

####################################################
# Resume Review
####################################################

resume.review.max-file-size=5242880
resume.review.max-extracted-characters=30000
resume.review.cloudinary-folder=skillforge/resumes

####################################################
# Cloudinary
####################################################

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

####################################################
# Error Handling
####################################################

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always